name: Offline Python and JavaScript tests

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.js"
      - "scripts/*.py"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "*.py"
      - "*.js"
      - "scripts/*.py"
      - "tests/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server.py corpus.py scripts tests
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/engine.test.js
